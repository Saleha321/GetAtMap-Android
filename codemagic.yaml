workflows:
  android-release:
    name: GetAtMap Android APK Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Set up local.properties
        script: |
          cd "getatmap 1"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          cd "getatmap 1"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "getatmap 1/app/build/outputs/apk/debug/*.apk"
