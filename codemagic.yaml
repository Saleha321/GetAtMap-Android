workflows:
  android-release:
    name: GetAtMap Android APK Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Auto Generate Missing Framework Files
        script: |
          # 1. Create missing .env files required by secrets plugin
          touch .env
          touch .env.example
          
          # 2. Automatically generate the missing gradlew scripts
          gradle wrapper
          
          # 3. Create a temporary upload key so the build doesnt crash on signingConfig
          keytool -genkey -v -keystore my-upload-key.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GetAtMap, OU=Development, O=GetAtMap, L=Islamabad, S=Punjab, C=PK" \
            -storepass "android" -keypass "android"
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          # Map temporary passwords to override env dependencies
          export STORE_PASSWORD="android"
          export KEY_PASSWORD="android"
      - name: Build Android Debug APK
        script: |
          chmod +x gradlew
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          export STORE_PASSWORD="android"
          export KEY_PASSWORD="android"
          ./gradlew assembleDebug
    artifacts:
      - "app/build/outputs/apk/debug/*.apk"
